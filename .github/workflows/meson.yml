name: Meson

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - uses: BSFishy/meson-build@v1.0.3
        with:
          action: build
          setup-options: -DVKVG_RECORDING=false # -DVKVG_SVG=false
          meson-version: "1.12.1"
          ninja-version: "1.13.2"
