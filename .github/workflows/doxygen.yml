name: Doxygen CI
on:
  push:
    branches:
      - test

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
            submodules: true

      - name: Install requirements
        run: sudo apt install graphviz ninja doxygen cmake

      - name: Configure Cmake
        run: cmake -G Ninja -B build -S . -DVKVG_BUILD_DOCS=TRUE
      
      - name: Build documentation
        run: cmake --build build -t doxygen

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/doc/html


